name: ShellCheck Linting

on:
  push:
    branches: [ main ]

jobs:
  shellcheck:
    name: Scan Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          # Explicitly ignore any files ending in .zsh
          ignore_names: '*.zsh'
        env:
          SHELLCHECK_OPTS: -x
