name: Dotfiles CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  chezmoi:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/awan/cfg:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show chezmoi version
        run: chezmoi --version

      - name: Validate Zsh syntax
        run: find "$GITHUB_WORKSPACE" -type f -name "*.zsh" -print0 | xargs -0 -r zsh -n

      - name: Validate Shell scripts
        run: find "$GITHUB_WORKSPACE" -type f -name "*.sh" -print0 | xargs -0 -r shellcheck -S error

      - name: Validate chezmoi source
        run: |
          mkdir -p /tmp/chezmoi-home
          chezmoi --source "$GITHUB_WORKSPACE" --destination /tmp/chezmoi-home apply --dry-run --exclude=encrypted,templates

      - name: Test Slack failure notification
        run: exit 1

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          CI_STATUS: ${{ job.status }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0

          payload=$(printf '{"text":"Dotfiles CI: %s\\n%s"}' "$CI_STATUS" "$CI_RUN_URL")
          curl -fsS \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
