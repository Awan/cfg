name: Dotfiles CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  chezmoi:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Install CI dependencies
        run: pacman -Syu --noconfirm --needed git nodejs chezmoi zsh shellcheck age curl diffutils


      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show chezmoi version
        run: chezmoi --version

      - name: Validate Zsh syntax
        run: find "$GITHUB_WORKSPACE" -type f -name "*.zsh" -print0 | xargs -0 -r zsh -n

      - name: Validate Shell scripts
        run: find "$GITHUB_WORKSPACE" -type f -name "*.sh" -print0 | xargs -0 -r shellcheck -S error

      - name: Validate chezmoi source
        run: |
          mkdir -p /tmp/chezmoi-ci/bin
          printf '%s\n' '#!/bin/sh' '[ "$1" = "show" ] || exit 1' 'case "$2" in' 'isync/user) printf "%s\n" "ci-test@example.invalid" ;;' 'isync/pass) printf "%s\n" "ci-test-password" ;;' '*) exit 1 ;;' 'esac' > /tmp/chezmoi-ci/bin/passage
          chmod +x /tmp/chezmoi-ci/bin/passage
          printf '%s\n' '[pass]' 'command = "/tmp/chezmoi-ci/bin/passage"' > /tmp/chezmoi-ci/chezmoi.toml
          mkdir -p /tmp/chezmoi-home
          chezmoi --config /tmp/chezmoi-ci/chezmoi.toml --source "$GITHUB_WORKSPACE" --destination /tmp/chezmoi-home apply --dry-run --exclude=encrypted

      - name: Validate encrypted age files
        run: |
          age-keygen -o /tmp/ci-age-key.txt
          for file in dot_android/encrypted_adbkey.pub.age dot_android/encrypted_private_adbkey.age private_dot_config/pacman/encrypted_installed_packages.age; do
            if age --decrypt --identity /tmp/ci-age-key.txt "$file" >/dev/null 2>/tmp/age-error; then
              echo "Unexpected decryption success: $file"
              exit 1
            fi
            if ! grep -Fq 'no identity matched any of the recipients' /tmp/age-error; then
              cat /tmp/age-error
              echo "Invalid age file or unexpected error: $file"
              exit 1
            fi
          done

      - name: Validate age encryption round-trip
        run: |
          age-keygen -o /tmp/fixture-key.txt
          age-keygen -y /tmp/fixture-key.txt > /tmp/fixture-recipient.txt
          printf '%s\n' 'chezmoi CI age fixture' > /tmp/fixture-plain.txt
          age -r "$(cat /tmp/fixture-recipient.txt)" -o /tmp/fixture.age /tmp/fixture-plain.txt
          age --decrypt -i /tmp/fixture-key.txt -o /tmp/fixture-decrypted.txt /tmp/fixture.age
          cmp -s /tmp/fixture-plain.txt /tmp/fixture-decrypted.txt

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
          CI_STATUS: ${{ job.status }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(printf '{"text":"Dotfiles CI: %s\\n%s"}' "$CI_STATUS" "$CI_RUN_URL")
          curl -fsS -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
