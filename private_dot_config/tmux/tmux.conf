# Prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# Shell and config
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
bind r source-file ~/.config/tmux/tmux.conf \; display "configuration file reloaded"

# Panes and navigation
bind e setw synchronize-panes \; display "synchronize mode"
unbind %
unbind '"'
bind b split-window -v
bind v split-window -h
setw -g mode-keys vi
set -g status-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind x kill-pane
bind Z previous-layout
bind X next-layout
bind D detach -a

# Copy and paste
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -n MouseDown2Pane run-shell 'xclip -selection primary -o | tmux load-buffer -b __primary - && tmux paste-buffer -b __primary -d'

# Other controls
bind : command-prompt
bind t set status
bind z run-shell "/usr/bin/physlock -dmp 'you cant run this system fuckin looser'"
bind o run-shell "mpc toggle >/dev/null 2>&1"
set -g mouse on
set -g visual-activity on
set -g bell-action none

# Terminal
set -g default-terminal tmux-256color
set -as terminal-overrides ',xterm-256color:RGB,xterm*:smcup@:rmcup@'

# Show system details on a virtual console and a session label in X.
set -g status on
set -g status-justify left
set -g status-interval 30
set -g status-style fg=colour130,bg=colour235
set -g status-left-length 30
set -g status-left '#[fg=colour196] #S '
set -g status-right-length 120
set -g status-right '#(~/.local/bin/tmux-status "#{session_name}" "#{client_pid}")'
setw -g automatic-rename on
setw -g window-status-style bg=default,fg=colour33
setw -g window-status-current-style bg=default,fg=colour196

# Layout and history
set -g clock-mode-colour colour20
setw -g aggressive-resize on
set -sg escape-time 0
set -g history-limit 10000
set -g pane-base-index 1
set -g renumber-windows on
set -g base-index 1
set -g display-panes-active-colour colour20
set -g display-panes-colour colour196
set -g pane-border-style fg=green,bg=black
set -g pane-active-border-style fg=white,bg=yellow

# Environment and URL picker
set -g update-environment "DBUS_SESSION_BUS_ADDRESS DISPLAY SSH_AUTH_SOCK XAUTHORITY"
set -g message-style bg=colour235,fg=colour196
run-shell "$HOME/.local/bin/tmux.urlscan"
