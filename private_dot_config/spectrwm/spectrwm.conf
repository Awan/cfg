# Behavior
workspace_limit = 10
layout_order = vertical,horizontal,max
focus_mode = default
focus_close = previous
focus_close_wrap = 1
focus_default = last
spawn_position = next
uniconify_order = latest
cycle_visible = 1
workspace_clamp = 1
warp_focus = 1
click_to_raise = 1
warp_pointer = 1
fullscreen_hide_other = 1
fullscreen_unfocus = restore
# iconic_enabled = 1
maximize_hide_bar = 0
boundary_width = 50
center_autobalance = 0
center_adaptive = 1
center_noautostack = 0
center_nowrap = 1

# Window appearance
border_width = 1
color_focus = rgb:00/d7/ff
color_focus_maximized = rgb:00/d7/ff
color_unfocus = rgb:44/44/44
color_unfocus_maximized = rgb:44/44/44
region_padding = 4
tile_gap = 5
move_step = 20
resize_step = 50
disable_border = 1
disable_padding = 1


# Bar
# bar_justify = center
bar_border_width = 0
bar_padding_horizontal = 6
bar_padding_vertical = 2
bar_color = rgba:00/00/00/bf
bar_border[1] = rgb:00/80/80
# bar_font = BlexMono Nerd Font Mono:pixelsize=17
bar_font = MesloLGM Nerd Font Mono:style=Regular:pixelsize=13:antialias=true
# bar_font = mononoki Nerd Font:pixelsize=9:antialias=true
bar_font_color = rgb:ff/ff/ff,rgb:ff/30/30,rgb:00/d7/ff,rgb:50/e0/50,rgb:ff/d7/00,rgb:c0/80/ff,rgb:ff/a5/00,rgb:ff/ee/66,rgb:50/e0/50,rgb:ff/a5/00,rgb:ff/80/c0,rgb:00/e6/a8,rgb:ca/7a/ff,rgb:ff/6b/6b,rgb:5a/9b/ff,rgb:ff/4d/6d,rgb:d4/ff/00,rgb:ff/7a/18,rgb:ff/60/d0,rgb:00/c8/ff,rgb:00/b7/a4
bar_action = ~/.local/bin/spectrwm-status-native
bar_action_expand = 1
bar_delay = 1
# bar_format = +|3L+L+|T+@fg=19;%a %d %b %H:%M+@fg=0;+|8R+A
bar_format = +|3L+L+|8R+A +@fg=19;%a %d %b %H:%M+@fg=0;
workspace_indicator = listcurrent,listactive,markcurrent,markactive,listurgent,markurgent
workspace_mark_active = '+@fg=17;+'
workspace_mark_active_suffix = '+@fg=0;'
workspace_mark_current = '+@fg=2;>'
workspace_mark_current_suffix = '+@fg=0;'
workspace_mark_urgent = '+@fg=1;!'
workspace_mark_urgent_suffix = '+@fg=0;'
urgent_enabled = 1

# Programs
program[term] = alacritty
program[menu] = dmenu_run $dmenu_bottom -fn $bar_font -nb $bar_color -nf $bar_font_color -sb $bar_color_selected -sf $bar_font_color_selected
program[xf] = alacritty
program[browser] = ~/.local/bin/spectrwm-browser
program[mpc_toggle] = mpc toggle
program[mpc_seek_backward] = mpc seek -10
program[mpc_seek_forward] = mpc seek +10
program[volume_up] = ~/.local/bin/spectrwm-osd volume-up
program[volume_down] = ~/.local/bin/spectrwm-osd volume-down
program[volume_mute] = ~/.local/bin/spectrwm-osd volume-mute
program[bluetooth_toggle] = ~/.local/bin/spectrwm-osd bluetooth-toggle
program[wlan_status] = ~/.local/bin/spectrwm-osd wlan-status
program[mic_mute] = ~/.local/bin/spectrwm-osd mic-mute
program[brightness_up] = ~/.local/bin/spectrwm-osd brightness-up
program[brightness_down] = ~/.local/bin/spectrwm-osd brightness-down
program[scratchpad_toggle] = ~/.local/bin/spectrwm-scratchpad switch-app
program[scratchpad_mark] = ~/.local/bin/spectrwm-scratchpad toggle-flag
program[touchpad] = ~/.local/bin/touchpad
program[wallpaper] = ~/.local/bin/artwall
program[wallpaper_reject] = ~/.local/bin/artwall --reject
program[lock_now] = xset s activate
program[lock] = ~/.local/bin/i3lock
program[rofi] = rofi -show combi
program[screenshot_all] = sh -c 'import -quality 100 -window root -resize 75% /tmp/foo.png && xclip -selection clipboard -t image/png -i /tmp/foo.png'
program[screenshot_wind] = bash -o pipefail -c 'import -window "$(xdotool getwindowfocus)" -quality 100 png:- | xclip -selection clipboard -t image/png'


# Soft keys
# XF86AudioRaiseVolume: increase volume.
bind[volume_up] = XF86AudioRaiseVolume
# XF86AudioLowerVolume: decrease volume.
bind[volume_down] = XF86AudioLowerVolume
# XF86AudioMute: toggle audio mute.
bind[volume_mute] = XF86AudioMute
# XF86Bluetooth: toggle Bluetooth.
bind[bluetooth_toggle] = XF86Bluetooth
# XF86WLAN: show WLAN status.
bind[wlan_status] = XF86WLAN
# XF86AudioMicMute: toggle microphone mute.
bind[mic_mute] = XF86AudioMicMute
# XF86MonBrightnessUp: increase display brightness.
bind[brightness_up] = XF86MonBrightnessUp
# XF86MonBrightnessDown: decrease display brightness.
bind[brightness_down] = XF86MonBrightnessDown
# Print: capture a screenshot of the whole screen.
bind[screenshot_all] = Print
# Super+Shift+Print: copy a screenshot of the focused window to the clipboard.
bind[screenshot_wind] = MOD+Shift+Print

# Keyboard shortcuts; MOD is Super (the Windows key).
modkey = Mod4
# Super+Shift+Return: launch the alternate terminal.
bind[xf] = MOD+Shift+Return
# Super+Return: launch a terminal.
bind[term] = MOD+Return
# Super+D: open the application menu.
bind[menu] = MOD+d
# Super+Q: close the focused window.
bind[wind_del] = MOD+q
# Super+Shift+Q: force-kill the focused window's application.
bind[wind_kill] = MOD+Shift+q
# Super+Shift+Escape: quit spectrwm.
bind[quit] = MOD+Shift+Escape
# Super+Alt+I: iconify (minimize) the focused window.
bind[iconify] = MOD+Mod1+i
# Super+Shift+Alt+I: choose and restore an iconified window.
bind[uniconify] = MOD+Shift+Mod1+i
# Super+Alt+U: restore the most recently iconified window.
bind[uniconify_quick] = MOD+Mod1+u
# Super+R: restart spectrwm.
bind[restart] = MOD+r
# Super+Shift+R: reload the configuration without restarting spectrwm.
bind[reload] = MOD+Shift+r
# Super+M: cycle through the configured layouts.
bind[cycle_layout] = MOD+m
# Super+V: select vertical layout.
bind[layout_vertical] = MOD+v
# Super+Shift+Z: select horizontal layout.
bind[layout_horizontal] = MOD+Shift+z
# Super+Shift+M: select max layout for the current workspace.
bind[layout_max] = MOD+Shift+m
# Unbind spectrwm's default Super+E maximize shortcut.
bind[] = MOD+e
# Super+E: switch to the first empty workspace.
bind[ws_empty] = MOD+e
# Unbind spectrwm's default Super+Shift+E fullscreen shortcut.
bind[] = MOD+Shift+e
# Super+Shift+E: move the focused window to the first empty workspace.
bind[ws_empty_move] = MOD+Shift+e
# Unbind spectrwm's default Super+Shift+Space stack reset shortcut.
bind[] = MOD+Shift+space
# Super+F: toggle fullscreen for the focused window.
bind[fullscreen_toggle] = MOD+f
# Super+S: toggle floating/tiled state for the focused window.
bind[float_toggle] = MOD+s
# Super+G: swap the focused window with the master window.
bind[swap_main] = MOD+g
# Super+Shift+G: balance the stack area.
bind[stack_balance] = MOD+Shift+g
# Super+H: shrink the master area.
bind[master_shrink] = MOD+h
# Super+L: grow the master area.
bind[master_grow] = MOD+l
# Super+Comma: add a window to the master area.
bind[master_add] = MOD+comma
# Super+Period: remove a window from the master area.
bind[master_del] = MOD+period
# Super+Shift+Comma: add a column or row to the stack area.
bind[stack_inc] = MOD+Shift+comma
# Super+Shift+Period: remove a column or row from the stack area.
bind[stack_dec] = MOD+Shift+period
# Super+J: focus the next window.
bind[focus_next] = MOD+j
# Super+K: focus the previous window.
bind[focus_prev] = MOD+k
# Super+Shift+J: swap the focused window with the next window.
bind[swap_next] = MOD+Shift+j
# Super+Shift+K: swap the focused window with the previous window.
bind[swap_prev] = MOD+Shift+k
# Super+O: return focus to the previously focused window.
bind[focus_prior] = MOD+o
# Super+U: focus the next urgent window.
bind[focus_urgent] = MOD+u
# Super+Semicolon: switch to the next occupied workspace.
bind[ws_next] = MOD+semicolon
# Super+Backslash: switch to the centered layout.
bind[center_layout] = MOD+backslash
# Super+Shift+Backslash: swap the master and stack areas.
bind[flip_layout] = MOD+Shift+backslash
# Super+apostrophe: switch to the previous occupied workspace.
bind[ws_prev] = MOD+apostrophe
# Super+N: return to the previously used workspace.
bind[ws_prior] = MOD+n
# Super+Shift+H/L: focus the previous/next monitor region.
bind[rg_prev] = MOD+Shift+h
bind[rg_next] = MOD+Shift+l
# Super+Alt+Shift+H/L: move the focused window to the previous/next monitor region.
bind[mvrg_prev] = MOD+Shift+Mod1+h
bind[mvrg_next] = MOD+Shift+Mod1+l
# Super+Shift+Up/Down: move the focused window to the next/previous workspace.
bind[ws_next_move] = MOD+Shift+Up
bind[ws_prev_move] = MOD+Shift+Down
# Super+Alt+H/J/K/L: move a floating window left/down/up/right.
bind[move_left] = MOD+Mod1+h
bind[move_down] = MOD+Mod1+j
bind[move_up] = MOD+Mod1+k
bind[move_right] = MOD+Mod1+l
# Super+Alt+B: toggle status bars globally.
bind[bar_toggle] = MOD+Mod1+b
# Super+Shift+B: toggle the status bar on the current workspace.
bind[bar_toggle_ws] = MOD+Shift+b
# Super+B: focus the master window.
bind[focus_main] = MOD+b
# Super+I: toggle the scratchpad application.
bind[scratchpad_toggle] = MOD+i
# Super+Shift+I: toggle the focused window's scratchpad mark.
bind[scratchpad_mark] = MOD+Shift+i
# Super+Alt+E: run the touchpad toggle helper.
bind[touchpad] = MOD+Mod1+e
# Super+Alt+W: set the wallpaper.
bind[wallpaper] = MOD+Mod1+w
# Super+Shift+Alt+W: reject the current wallpaper.
bind[wallpaper_reject] = MOD+Shift+Mod1+w
# Super+X: activate the screen lock.
bind[lock_now] = MOD+x
# Alt+B: toggle music playback.
bind[mpc_toggle] = Mod1+b
# Alt+[: seek backward 10 seconds.
bind[mpc_seek_backward] = Mod1+bracketleft
# Alt+]: seek forward 10 seconds.
bind[mpc_seek_forward] = Mod1+bracketright
# Super+W: launch the browser.
bind[browser] = MOD+w
# Super+Shift+D: open the Rofi combi menu.
bind[rofi] = MOD+Shift+d

# Window rules

# Keep video players floating without forcing fullscreen.
quirk[MPlayer] = FLOAT
quirk[mpv] = FLOAT

# Workspace assignments.
quirk[Google-chrome:google-chrome] = WS[2]
quirk[Opera:Opera] = WS[3]
quirk[Gimp] = WS[5]
quirk[Anydesk] = WS[4]

# Float utility windows that should not be tiled.
quirk[Thunar] = FLOAT
quirk[Pavucontrol] = FLOAT
quirk[Galculator] = FLOAT
quirk[Gpick] = FLOAT
quirk[feh] = FLOAT
quirk[Pinentry] = FLOAT
quirk[Sxiv] = FLOAT
