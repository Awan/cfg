workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - test

chezmoi:
  stage: test
  image: archlinux:latest
  interruptible: true

  before_script:
    - pacman -Syu --noconfirm --needed git nodejs chezmoi zsh shellcheck age curl diffutils vim python

  script:
    - chezmoi --version
    - git ls-files -z -- '*.zsh' ':!archive/**' | xargs -0 -r zsh -n
    - zsh -n dot_zshenv dot_zshrc dot_zprofile
    - zsh -e -fc 'source dot_zsh/functions.zsh'
    - git ls-files -z -- '*.sh' '*.sh.tmpl' dot_xprofile ':!archive/**' | xargs -0 -r shellcheck -S error
    - bash .github/scripts/check-shell-files
    - vim -Nu NONE -n -es -c 'set rtp^=./dot_vim' -c 'source dot_vimrc' -c 'qa!'
    - |
      mkdir -p /tmp/chezmoi-ci/bin
      printf '%s\n' '#!/bin/sh' '[ "$1" = "show" ] || exit 1' 'case "$2" in' 'isync/user) printf "%s\n" "ci-test@example.invalid" ;;' 'isync/pass) printf "%s\n" "ci-test-password" ;;' '*) exit 1 ;;' 'esac' > /tmp/chezmoi-ci/bin/passage
      chmod +x /tmp/chezmoi-ci/bin/passage
      printf '%s\n' '[pass]' 'command = "/tmp/chezmoi-ci/bin/passage"' > /tmp/chezmoi-ci/chezmoi.toml
      mkdir -p /tmp/chezmoi-home
      chezmoi --config /tmp/chezmoi-ci/chezmoi.toml --source "$CI_PROJECT_DIR" --destination /tmp/chezmoi-home managed > /tmp/managed.txt
      test -s /tmp/managed.txt
      chezmoi --config /tmp/chezmoi-ci/chezmoi.toml --source "$CI_PROJECT_DIR" --destination /tmp/chezmoi-home apply --exclude=encrypted,scripts
      chezmoi --config /tmp/chezmoi-ci/chezmoi.toml --source "$CI_PROJECT_DIR" --destination /tmp/chezmoi-home verify --exclude=encrypted,scripts
    - |
      age-keygen -o /tmp/ci-age-key.txt
      for file in dot_android/encrypted_adbkey.pub.age dot_android/encrypted_private_adbkey.age private_dot_config/pacman/encrypted_installed_packages.age; do
        if age --decrypt --identity /tmp/ci-age-key.txt "$file" >/dev/null 2>/tmp/age-error; then
          echo "Unexpected decryption success: $file"
          exit 1
        fi
        if ! grep -Fq 'no identity matched any of the recipients' /tmp/age-error; then
          cat /tmp/age-error
          echo "Invalid age file or unexpected error: $file"
          exit 1
        fi
      done
    - |
      age-keygen -o /tmp/fixture-key.txt
      age-keygen -y /tmp/fixture-key.txt > /tmp/fixture-recipient.txt
      printf '%s\n' 'chezmoi CI age fixture' > /tmp/fixture-plain.txt
      age -r "$(cat /tmp/fixture-recipient.txt)" -o /tmp/fixture.age /tmp/fixture-plain.txt
      age --decrypt -i /tmp/fixture-key.txt -o /tmp/fixture-decrypted.txt /tmp/fixture.age
      cmp -s /tmp/fixture-plain.txt /tmp/fixture-decrypted.txt

secret-scan:
  stage: test
  image:
    name: ghcr.io/trufflesecurity/trufflehog@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    - |
      scan_base=""
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        scan_base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        scan_base="$CI_COMMIT_BEFORE_SHA"
      fi

      set -- --branch "$CI_COMMIT_SHA" --no-verification --no-update \
        --exclude-paths "$CI_PROJECT_DIR/.github/trufflehog-exclude-paths.txt" --fail
      if [ -n "$scan_base" ]; then
        set -- --since-commit "$scan_base" "$@"
      fi
      trufflehog git "file://$CI_PROJECT_DIR" "$@"
