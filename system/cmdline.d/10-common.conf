# Public kernel configuration from https://github.com/Awan/cfg.
# Review hardware-specific and system-policy options before applying to another machine.

# General boot behavior
rw
quiet
consoleblank=60
nowatchdog
mitigations=auto
loglevel=3
rd.systemd.show_status=auto
bgrt_disable

# Intel CPU and graphics tuning
intel_pstate=active
i915.enable_fbc=1
i915.enable_guc=2

# Power management
pcie_aspm=auto
usbcore.autosuspend=1

# Filesystem and network policy
noatime
ipv6.disable=1

# Security configuration
apparmor=1
security=apparmor
lsm=landlock,lockdown,yama,integrity,apparmor,bpf
