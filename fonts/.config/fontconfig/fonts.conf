<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Font search paths.
    /etc/fonts/fonts.conf already scans /usr/share/fonts and
    /usr/local/share/fonts system-wide. These two just make your
    user-level dirs explicit 
  -->
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>

  <!--
    Rendering quality.
    hintslight + rgb subpixel + lcddefault is the same baseline
    GNOME ships by default crisp without the slightly bloated
    look "hintfull" gives at small sizes. If you're on a HiDPI or
    scaled display, subpixel AA buys you nothing there; set rgba
    to "none" in that case and greyscale AA looks just as good.
  -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!--
    Default family substitution.
    Chrome, GTK, Qt, and most graphical apps ask
    fontconfig for the generic "sans-serif" / "serif" / "monospace"
    families these aliases decide what they actually render.
  -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Fira Code</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

</fontconfig>
